<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>R&C Chat</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#0b141a;color:#e9edef}body{overflow:hidden}.screen{height:100dvh;display:flex;align-items:center;justify-content:center}.hidden{display:none!important}.auth{width:min(430px,100%);height:100%;padding:32px 24px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,#075e54,#063c37 55%,#0b141a)}.brand{text-align:center;margin-bottom:28px}.logo{width:86px;height:86px;margin:auto;border-radius:28px;background:#25d366;display:grid;place-items:center;color:#fff;font-size:29px;font-weight:800;box-shadow:0 15px 40px #0007}.brand h1{margin:16px 0 5px;font-size:30px}.brand p{margin:0;color:#c5d0d3}.card{background:#111b21;border:1px solid #26353d;border-radius:24px;padding:22px;box-shadow:0 18px 50px #0005}.input{width:100%;padding:15px 16px;margin:7px 0;border:1px solid #30424a;border-radius:14px;background:#202c33;color:#fff;font-size:16px;outline:none}.input:focus{border-color:#25d366}.btn{width:100%;padding:15px;border:0;border-radius:14px;margin-top:10px;background:#25d366;color:#062d20;font-weight:800;font-size:16px}.btn.alt{background:#24343b;color:#e9edef}.error{min-height:22px;color:#ff7b72;font-size:13px;margin:7px 2px}.chat{height:100dvh;display:flex;flex-direction:column;background:#0b141a}.top{height:64px;flex:none;background:#202c33;display:flex;align-items:center;padding:8px 12px;gap:11px;box-shadow:0 1px 3px #0007;z-index:2}.avatar{width:44px;height:44px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-weight:800}.top .name{font-weight:700}.status{font-size:12px;color:#9aa8ae;margin-top:3px}.menu{margin-left:auto;font-size:24px;color:#cfd8dc}.messages{flex:1;overflow-y:auto;padding:18px 12px 12px;background-color:#0b141a;background-image:radial-gradient(#ffffff08 1px,transparent 1px);background-size:20px 20px}.bubble{max-width:78%;padding:8px 10px 6px;margin:6px 0;border-radius:12px;position:relative;word-break:break-word;font-size:15.5px;line-height:1.35}.mine{margin-left:auto;background:#005c4b;border-top-right-radius:4px}.theirs{margin-right:auto;background:#202c33;border-top-left-radius:4px}.meta{float:right;margin:5px 0 0 9px;font-size:10px;color:#aebdc3;white-space:nowrap}.checks{color:#53bdeb;margin-left:2px}.empty{text-align:center;margin:30vh auto 0;color:#94a4aa}.composer{flex:none;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#202c33;display:flex;align-items:end;gap:7px}.round{width:44px;height:44px;border:0;border-radius:50%;background:#2a3941;color:#d8e0e3;font-size:21px;flex:none}.msgbox{flex:1;min-height:44px;max-height:120px;border:0;border-radius:22px;background:#2a3941;color:#fff;padding:12px 15px;font-size:15px;outline:none;resize:none}.send{background:#25d366;color:#062d20}.emoji-panel{position:absolute;bottom:65px;left:6px;right:6px;background:#202c33;border:1px solid #33454d;border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;box-shadow:0 10px 35px #0008}.emoji-panel button{background:none;border:0;font-size:25px;padding:6px;border-radius:10px}.emoji-panel button:active{background:#33454d}
</style></head><body><section id="auth" class="screen"><div class="auth"><div class="brand"><div class="logo">R&C</div><h1>R&C Chat</h1><p>Mensajería privada</p></div><div class="card"><input id="email" class="input" type="email" placeholder="Correo electrónico" autocomplete="email"><input id="pass" class="input" type="password" placeholder="Contraseña" autocomplete="current-password"><div id="err" class="error"></div><button id="login" class="btn">Entrar</button><button id="register" class="btn alt">Crear cuenta</button></div></div></section><section id="chat" class="chat hidden"><header class="top"><div class="avatar">R&C</div><div><div class="name">R&C Chat</div><div class="status">en línea · privado</div></div><div class="menu">⋮</div></header><main id="messages" class="messages"></main><div id="emojiPanel" class="emoji-panel hidden"></div><form id="composer" class="composer"><button type="button" id="emoji" class="round">😊</button><textarea id="text" class="msgbox" rows="1" placeholder="Escribe un mensaje…"></textarea><button type="submit" class="round send">➤</button></form></section><script type="module" src="app.js?v=8"></script></body></html>
