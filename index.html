<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b7285"><meta name="description" content="R&C Chat"><link rel="manifest" href="manifest.json"><title>R&C Chat</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section id="home" class="screen"><div class="brand"><div class="logo">R&C</div><h1>R&C Chat</h1><p>Chat privado en tiempo real</p></div><div id="authBox" class="card"><h2 id="authTitle">Entrar</h2><input id="email" type="email" placeholder="Correo electrónico" autocomplete="email"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="loginBtn">Entrar</button><button id="registerBtn" class="secondary">Crear cuenta</button><p id="authMsg" class="msg"></p></div></section><section id="chat" class="screen hidden"><header><div><strong>R&C Chat</strong><span>Privado</span></div><button id="logoutBtn" class="logout">Salir</button></header><div id="messages" class="messages"></div><form id="sendForm" class="composer"><input id="messageInput" maxlength="1000" placeholder="Escribe un mensaje..." autocomplete="off"><button type="submit">➤</button></form></section></main><script type="module" src="app.js"></script></body></html>
