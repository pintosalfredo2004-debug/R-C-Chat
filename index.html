<section id="auth" class="screen auth"><div class="authbox"><div class="logo">R&C</div><h1>R&C Chat</h1><p>Mensajería privada</p><input id="name" class="input" type="text" placeholder="Tu nombre" autocomplete="name"><input id="email" class="input" type="email" placeholder="Correo electrónico" autocomplete="email"><input id="pass" class="input" type="password" placeholder="Contraseña" autocomplete="current-password"><div id="err" class="error"></div><button id="login" class="btn">Entrar</button><button id="register" class="btn alt">Crear cuenta</button></div></section>
